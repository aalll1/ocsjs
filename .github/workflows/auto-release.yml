name: Userscript Auto Releases

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.2.2'
          run_install: false
      - name: Verify version tag
        run: |
          test "$GITHUB_REF_NAME" = "$(node -p 'require("./package.json").version')"
          test -s CHANGELOG_CURRENT.md
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run regression tests
        run: pnpm test
      - name: Build userscripts
        env:
          VITE_BUILD_PATH: ../../dist
        run: |
          export PATH="$PWD/node_modules/.bin:$PWD/packages/core/node_modules/.bin:$PWD/packages/scripts/node_modules/.bin:$PATH"
          pnpm build
      - name: Verify artifacts
        run: |
          node --check dist/ocs.user.js
          grep -Eq "^// @version[[:space:]]+$GITHUB_REF_NAME$" dist/ocs.user.js
          grep -F 'https://github.com/aalll1/ocsjs' dist/ocs.user.js
          cd dist
          sha256sum ocs.user.js ocs.common.user.js core.js index.js > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG_CURRENT.md \
            dist/ocs.user.js dist/ocs.common.user.js dist/core.js dist/index.js \
            dist/SHA256SUMS.txt CHANGELOG_CURRENT.md CHANGELOG_SIMPLIFIED.md
